Benchmark:
  path: ./Benchmark/TauBench/retail/tasks_test.jsonl
  type: multi-agent
  # start_idx: 76
  # end_idx: 76
Toolkit:
  path: ./Toolkit/TauBench/retail
Environment:
  path: ./Environment/TauBench/retail
  type: per-task
Model:
  provider: openai-server
  parameters:
    temperature: 0.0
    top_p: null
    max_tokens: 4096
    timeout: 60
  providers:
    openai-server:
      # model_id: gpt-4o
      model_id: deepseek-v3.2
      api_base: http://your-api-server:port/v1
      # api_key: "your-api-key-here"
      # api_key: "your-api-key-here"
      api_key: "your-api-key-here"
      client_kwargs: {}
Agent:
  type: multi-agent
  agent_dir: ./Agent/TauBench/retail/tool_calling.jsonl
  agent_type: ToolCallingAgent
  stream_outputs: false
  planning_interval: -1
  max_tool_threads: 1
  fill_with_all_tools: false

Output:
  log_dir: ./Results/logs/TauBench/retail
  save_dir: ./Results/outputs/TauBench/retail
  include_environment: true
  environment_archive_dir: ./Results/environment/TauBench/retail
Evaluation:
  enabled: false
