Benchmark:
  path: ./Benchmark/AgentSafetyBench/released_data.jsonl
  type: "single-agent multi-round task" # Can be: single-agent multi-round task, single-agent single-round task, multi-agent task
  per_task_tools: true
  # start_idx: 10 # Optional: 1-based index of the first task to execute. Leave null to start from the beginning.
  # end_idx: 10   # Optional: 1-based index of the last task to execute. Leave null to run through the end.

Toolkit:
  path: ./Toolkit/AgentSafetyBench

Environment:
  path: ./Environment/AgentSafetyBench
  type: per-task # Can be: null,global, per-task(In this mode, each benchmark task corresponds to an environment, and the path configuration of the environment must be included in the benchmark.)


Model:
  provider: "openai-server"  # Select which provider block below to activate.
  parameters:               # Global defaults merged into all providers (override per provider if needed).
    temperature: 0
    max_tokens: 12800
    # do_sample: true
    timeout: 30

  providers:
    openai-server:
      model_id: "gpt-4o-mini"
      api_base: "http://your-api-server:port/v1"
      api_key: "your-api-key-here"
      organization: null
      project: null
      client_kwargs: {}

Agent:
  type: "single-agent multi-round" # Can be: single-agent multi-round, single-agent single-round, multi-agent
  agent_dir: ./Agent/AgentSafetyBench/Agent.jsonl
  agent_type: "ToolCallingAgent" # Can be: ToolCallingAgent, CodeAgent
  planning_interval: -1 # The interval at which the agent will run a planning step. If -1, the agent will run default planning interval.
  max_tool_threads: 1 # The maximum number of threads for parallel tool calls.
  max_attempts: 3

Output:
  log_dir: ./Results/logs/AgentSafetyBench/dbbench
  save_dir: ./Results/outputs/AgentSafetyBench/dbbench
  eval_results: ./Results/metrics.json


