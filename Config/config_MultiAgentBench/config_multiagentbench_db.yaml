Benchmark:
  path: ./Benchmark/MultiAgentBench/dbbench/database_standardized_merged.jsonl
  type: multi-agent task
  per_task_tools: false  # Set true to build per-task agents with tools from matching dataset subfolder
  # start_idx: 0
  # end_idx: 1
  
Toolkit:
  path: ./Toolkit/MultiAgentBench/dbbench
Environment:
  path: ./Environment/MultiAgentBench/dbbench
  type: per-task
Model:
  provider: openai-server
  parameters:
    temperature: 0.0
  providers:
    openai-server:
      model_id: gpt-4o-mini  
      api_base: http://your-api-server:port/v1
      api_key: your-api-key-here

Agent:
  type: multi-agent
  agent_dir: ./Agent/MultiAgentBench/dbbench/MultiAgent.jsonl
  agent_type: ToolCallingAgent
  stream_outputs: false
  planning_interval: -1
  max_tool_threads: 1
  prompt_templates: None
  fill_with_all_tools: false
  entry_agent_name: Manager

Output:
  log_dir: ./Results/logs/MultiAgentBench/dbbench
  save_dir: ./Results/outputs/MultiAgentBench/dbbench
  eval_results: ./Results/metrics.json

Evaluation:
  type: llm
  save_dir: ./Results/evaluations/MultiAgentBench/dbbench
  server:
    model_id: gemini-3-flash-preview
    api_base: http://your-api-server:port/v1
    api_key: "your-api-key-here" 
    # api_key: "your-api-key-here"
    judge_prompt_template: Evaluation/prompt_templates/MAS_prompt_templates/evaluation_db_prompts.yaml
  
