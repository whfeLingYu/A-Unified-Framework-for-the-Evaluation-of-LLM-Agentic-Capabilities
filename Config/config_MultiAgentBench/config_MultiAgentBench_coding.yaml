Benchmark:
  path: ./Benchmark/MultiAgentBench/coding/coding_merged_clean.jsonl
  type: multi-agent task
  per_task_tools: false
  start_idx: 59
  # end_idx: 1

Toolkit:
  path: ./Toolkit/MultiAgentBench/coding

Environment:
  path: ./Environment/MultiAgentBench/coding
  type: per-task

Model:
  provider: openai-server
  parameters:
    temperature: 0.0
    top_p: null
  providers:
    openai-server:
      model_id: deepseek-v3.2
      api_base:  http://your-api-server:port/v1
      api_key: "your-api-key-here"
      client_kwargs: {}

Agent:
  type: multi-agent
  agent_dir: ./Agent/MultiAgentBench/coding/MultiAgent.jsonl
  agent_type: ToolCallingAgent
  stream_outputs: false
  planning_interval: -1
  max_tool_threads: 1
  fill_with_all_tools: false

Output:
  log_dir: ./Results/logs/MultiAgentBench/coding
  save_dir: ./Results/outputs/MultiAgentBench/coding

Evaluation:
  type: llm
  save_dir: ./Results/evaluations/MultiAgentBench/coding
  server:
    # model_id: gemini-3-flash-preview
    # api_base: http://your-api-server:port/v1
    # api_key: "your-api-key-here" 
    # api_key: "your-api-key-here"
    judge_prompt_template: Evaluation/prompt_templates/MAS_prompt_templates/evaluation_db_prompts.yaml
  
