Benchmark:
  path: ./Benchmark/MultiAgentBench/research/research_merged_clean.jsonl
  type: multi-agent task
  per_task_tools: true
  start_idx: 1
  end_idx: 1

Toolkit:
  path: ./Toolkit/MultiAgentBench/research_online
  # path: ./Toolkit/MultiAgentBench/research
# Environment:
#   path: ./Environment/MultiAgentBench/research
#   type: per-task

Model:
  provider: openai-server
  parameters:
    temperature: 0.0
  providers:
    openai-server:
      model_id: gpt-4o-mini
      api_base: http://your-api-server:port/v1
      api_key: "your-api-key-here"
      client_kwargs: {}

Agent:
  type: multi-agent
  agent_dir: ./Agent/MultiAgentBench/research/task_1.jsonl
  agent_type: ToolCallingAgent
  stream_outputs: false
  planning_interval: -1
  max_tool_threads: 1
  fill_with_all_tools: false
  entry_agent_name: Manager


Output:
  log_dir: ./Results/logs/MultiAgentBench/research_gpt_4o_mini_original
  save_dir: ./Results/outputs/MultiAgentBench/research_gpt_4o_mini_original

Evaluation:
  type: llm
  save_dir: ./Results/evaluations/MultiAgentBench/research_gpt_4o_mini
  server:
    model_id: gemini-3-flash-preview
    api_base: http://your-api-server:port/v1
    api_key: "your-api-key-here" 
    # api_key: "your-api-key-here"
    judge_prompt_template: Evaluation/prompt_templates/MAS_prompt_templates/evaluation_research_prompts.yaml
  